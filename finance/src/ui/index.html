<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ระบบการเงิน โรงเรียนกาวิละวิทยาลัย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@200;300;400;500;600;700&family=Geist:wght@200;300;500;600&family=Geist+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  /*
    ภาษาภาพ: Bento grid + Liquid Glass
    พื้นหลังไล่สีอ่อน (aurora) · การ์ดกระจกโปร่ง เบลอพื้นหลัง ขอบสว่างด้านใน เงานุ่ม · มุมโค้งใหญ่
    แถบสีบอกบทบาทยังคงอยู่ (ผังขั้นตอนของโรงเรียน) · ตัวหนังสือบนกระจกใช้พื้นทึบพอให้อ่านชัด (คอนทราสต์ ≥ 4.5)
    เบลอเฉพาะพื้นที่เล็ก (หัวหน้า เมนู กล่องโต้ตอบ การ์ด bento) เพื่อไม่ให้เครื่องช้า
  */
  :root {
    color-scheme:light;
    --paper:rgba(255,255,255,.78); --solid:#ffffff; --lane:rgba(255,255,255,.42); --lane-edge:rgba(255,255,255,.7); --ink:#1b1f2a; --muted:#596070; --rule:rgba(60,70,100,.22); --rule-soft:rgba(60,70,100,.12);
    --node-edge:#2a2d33;
    --sys-bg:rgba(226,235,250,.78); --sys-edge:#9fb1cc; --decide-bg:rgba(255,243,208,.85); --decide-edge:#d9b65c; --handoff:#0b6770;
    --r-plan:#7b3fd1; --r-finance:#2459d6; --r-proc:#b4561b; --r-review:#4f7d12; --r-committee:#be1d6c;
    --r-exec:#0f766e; --r-system:#6b7280; --r-teacher:#4a5568; --r-unit:#3f6212; --r-admin:#334155; --r-audit:#7c5e10;
    --bad:#b42318; --bad-bg:rgba(253,236,234,.92); --ok:#17733a; --ok-bg:rgba(226,244,231,.92); --warn:#835400; --warn-bg:rgba(253,243,214,.92);
    --focus:#2459d6;
    --glass:rgba(255,255,255,.58); --glass-strong:rgba(255,255,255,.82); --glass-edge:rgba(255,255,255,.85); --glass-line:rgba(40,55,90,.12);
    --shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 8px 28px rgba(40,60,110,.12), 0 1px 3px rgba(40,60,110,.10);
    --blur:blur(18px) saturate(1.6);
    --radius:20px; --radius-sm:12px;
    --bg1:#dfe9ff; --bg2:#f3e6ff; --bg3:#d9f4ee; --bg4:#fff0dc;
    --chip:rgba(255,255,255,.7); --hover:rgba(36,89,214,.08); --mute-bg:rgba(100,110,130,.14);
  }
  * { box-sizing:border-box; }
  html, body { margin:0; }
  body { font-family:'Geist','Sarabun','TH Sarabun New',sans-serif; font-size:16px; line-height:1.6; color:var(--ink); font-variant-numeric:tabular-nums; min-height:100vh;
    background:var(--bg1); background-attachment:fixed; }
  body::before { content:''; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(60vmax 50vmax at 8% 0%, var(--bg2), transparent 60%), radial-gradient(55vmax 45vmax at 100% 10%, var(--bg3), transparent 60%), radial-gradient(50vmax 50vmax at 70% 100%, var(--bg4), transparent 60%), var(--bg1); }
  button, input, select, textarea { font:inherit; color:inherit; }
  :focus-visible { outline:2.5px solid var(--focus); outline-offset:2px; }
  .hidden { display:none !important; }
  ::selection { background:rgba(36,89,214,.25); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; scroll-behavior:auto !important; } }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))) {
    :root { --glass:rgba(255,255,255,.94); --glass-strong:rgba(255,255,255,.98); }
  }
  .glass { background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); }

  /* ---------- ปุ่ม ป้าย ---------- */
  .btn { border:1px solid var(--glass-line); background:var(--glass-strong); padding:6px 16px; border-radius:999px; cursor:pointer; transition:transform .12s ease, box-shadow .15s ease, background .15s ease; box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 1px 2px rgba(40,60,110,.1); }
  .btn:hover { box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 4px 12px rgba(40,60,110,.16); transform:translateY(-1px); }
  .btn:active { transform:translateY(0) scale(.98); }
  .btn.primary { background:linear-gradient(180deg, #4a7bf0, var(--r-finance)); border-color:#1d4bb8; color:#fff; font-weight:600; text-shadow:0 1px 0 rgba(0,0,0,.18); }
  .btn.small { padding:2px 12px; font-size:14px; }
  .btn.ok { color:var(--ok); border-color:rgba(23,115,58,.4); } .btn.no { color:var(--bad); border-color:rgba(180,35,24,.4); }
  .btn[disabled] { opacity:.6; cursor:progress; transform:none; }
  .rtag { display:inline-flex; align-items:center; gap:5px; font-size:13px; font-weight:600; padding:0 10px; border-radius:20px; border:1.5px solid currentColor; background:var(--chip); white-space:nowrap; line-height:1.6; }
  .handoff { display:inline-flex; align-items:center; font-style:italic; font-weight:600; font-size:13.5px; color:var(--handoff); border:1.5px solid var(--handoff); border-radius:20px; padding:0 12px; background:var(--chip); white-space:nowrap; text-decoration:none; }
  button.handoff { cursor:pointer; transition:background .15s; } button.handoff:hover { background:var(--hover); }
  .pill { display:inline-block; padding:0 10px; border-radius:20px; font-size:13px; font-weight:600; line-height:1.7; }
  .pill.wait { background:var(--warn-bg); color:var(--warn); } .pill.ok { background:var(--ok-bg); color:var(--ok); } .pill.no { background:var(--bad-bg); color:var(--bad); } .pill.mute { background:var(--mute-bg); color:var(--muted); }
  .note { color:var(--muted); font-size:14.5px; }

  /* ---------- หัวกระดาษ ---------- */
  .runhead { display:flex; justify-content:space-between; gap:12px; font-size:13px; color:var(--muted); padding:6px 24px; }
  .topbar { position:sticky; top:8px; z-index:20; display:flex; align-items:center; gap:10px 24px; flex-wrap:wrap; padding:10px 18px; margin:0 12px; border-radius:var(--radius); background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); }
  .brand { min-width:200px; }
  .brand b { font-size:20px; font-weight:700; letter-spacing:-.005em; display:block; line-height:1.25; }
  .brand span { font-size:13.5px; color:var(--muted); }
  .who { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .who .name { font-weight:600; }

  /* ---------- โครงหน้า: เมนูเป็นแผงกระจก ---------- */
  .shell { display:grid; grid-template-columns:268px minmax(0, 1fr); gap:0; transition:grid-template-columns .25s ease; padding:12px 12px 0; }
  .shell.collapsed { grid-template-columns:0 minmax(0, 1fr); }
  .shell.collapsed .side { visibility:hidden; border-width:0; padding-left:0; padding-right:0; transition:visibility 0s .25s; }
  .side { position:sticky; top:84px; align-self:start; max-height:calc(100vh - 100px); overflow:auto; background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); border-radius:var(--radius); padding:10px 10px 18px; min-width:0; scrollbar-width:thin; }
  .side .item { display:flex; align-items:center; gap:10px; width:100%; text-align:left; border:0; background:none; padding:6px 10px; border-radius:12px; cursor:pointer; transition:background .15s; }
  .side .item:hover { background:var(--hover); }
  .side .item[aria-current="true"] { background:var(--glass-strong); box-shadow:0 1px 0 rgba(255,255,255,.8) inset, 0 2px 8px rgba(40,60,110,.16), inset 0 0 0 1.5px var(--focus); font-weight:600; }
  .side .item .lbl { flex:1; min-width:0; line-height:1.35; }
  .ico { width:17px; height:17px; flex:none; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; color:var(--muted); }
  .item[aria-current="true"] .ico { color:var(--focus); }
  .side .count { font-size:13px; color:var(--muted); min-width:20px; text-align:right; }
  .side .count.alert { background:var(--decide-bg); color:var(--warn); border:1px solid var(--decide-edge); border-radius:20px; padding:0 7px; font-weight:600; font-size:12.5px; min-width:22px; text-align:center; }
  .grp { margin-top:12px; }
  .grp-head { display:flex; align-items:center; gap:8px; width:100%; border:0; background:none; padding:4px 10px; border-radius:10px; cursor:pointer; font-size:13px; font-weight:700; color:var(--muted); text-align:left; letter-spacing:.01em; }
  .grp-head:hover { background:var(--hover); color:var(--ink); }
  .grp-head i { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .grp-head .chev { margin-left:auto; width:15px; height:15px; transition:transform .2s ease; }
  .grp:not(.closed) .grp-head .chev { transform:rotate(90deg); }
  .grp-items { display:grid; grid-template-rows:1fr; transition:grid-template-rows .22s ease; }
  .grp.closed .grp-items { grid-template-rows:0fr; }
  .grp-inner { overflow:hidden; min-height:0; margin-left:14px; padding-left:6px; border-left:1.5px solid var(--glass-line); display:flex; flex-direction:column; gap:1px; margin-top:2px; }
  .grp.closed .grp-inner { visibility:hidden; transition:visibility 0s .22s; }
  .home-item { margin-top:2px; }
  .tool { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:1px solid var(--glass-line); background:var(--glass-strong); border-radius:999px; padding:5px 12px; cursor:pointer; transition:transform .12s, box-shadow .15s; }
  .tool:hover { box-shadow:0 4px 12px rgba(40,60,110,.16); transform:translateY(-1px); }
  .tool .ico { color:var(--ink); }
  .tool kbd { font:inherit; font-size:12.5px; color:var(--muted); border:1px solid var(--rule-soft); border-radius:6px; padding:0 6px; background:var(--chip); }
  .toolbar-top { display:flex; align-items:center; gap:8px; }
  #sideToggle { padding:5px 8px; }
  #cmd { margin:12vh auto 0; width:min(580px, calc(100vw - 24px)); }
  #cmd .node { padding:12px 14px 10px 20px; }
  #cmdQ { width:100%; border:0; border-bottom:1.5px solid var(--rule-soft); padding:8px 4px 10px; outline:none; background:transparent; font-size:17px; }
  #cmdList { list-style:none; margin:6px 0 2px; padding:0; max-height:46vh; overflow:auto; }
  #cmdList li { display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:12px; cursor:pointer; }
  #cmdList li[aria-selected="true"] { background:var(--hover); box-shadow:inset 0 0 0 1.5px var(--focus); }
  #cmdList .c-main { flex:1; min-width:0; } #cmdList .c-t { font-weight:600; } #cmdList .c-d { font-size:13.5px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #cmdList .c-g { font-size:13px; color:var(--muted); white-space:nowrap; }
  #cmdEmpty { padding:18px 8px; color:var(--muted); }
  #cmdHint { font-size:13px; color:var(--muted); padding:6px 4px 0; border-top:1px solid var(--rule-soft); }
  main { padding:6px 10px 64px 20px; min-width:0; animation:rise .28s ease both; }
  .shell.collapsed main { padding-left:6px; }
  @keyframes rise { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
  .page-title { font-size:28px; font-weight:700; line-height:1.3; margin:8px 0 0; letter-spacing:-.01em; }
  .page-desc { color:var(--muted); margin:4px 0 18px; max-width:68ch; }
  .toolbar { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .toolbar .grow { flex:1; }
  .search { padding:7px 14px; border:1px solid var(--glass-line); border-radius:999px; width:280px; background:var(--glass-strong); }
  .msg { padding:9px 14px; border-radius:var(--radius-sm); margin:0 0 14px; }
  .msg.bad { background:var(--bad-bg); color:var(--bad); } .msg.ok { background:var(--ok-bg); color:var(--ok); }
  #toasts { position:fixed; right:16px; bottom:16px; z-index:300; display:flex; flex-direction:column; gap:8px; max-width:min(420px, calc(100vw - 32px)); }
  .toast { padding:10px 14px; border-radius:var(--radius-sm); background:var(--glass-strong); border:1px solid var(--glass-edge); box-shadow:var(--shadow); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); animation:rise .2s ease both; }
  .toast.bad { color:var(--bad); border-color:var(--bad); }

  /* ---------- โหนด (การ์ดกระจกมีแถบสีบทบาท) ---------- */
  .node { position:relative; background:var(--glass-strong); border:1px solid var(--glass-edge); box-shadow:0 1px 0 rgba(255,255,255,.7) inset, 0 3px 10px rgba(40,60,110,.12); border-radius:var(--radius-sm); padding:8px 12px 10px 18px; }
  .node::before { content:''; position:absolute; left:6px; top:10px; bottom:10px; width:4px; border-radius:4px; background:var(--bar, var(--r-system)); }
  .node .who-does { font-size:13px; font-weight:700; color:var(--bar, var(--r-system)); line-height:1.4; }
  .node .t { font-size:16.5px; font-weight:700; line-height:1.35; }
  .node .d { font-size:14px; color:var(--muted); line-height:1.45; }
  .node.sys { background:var(--sys-bg); border-color:var(--sys-edge); }
  .node.decide { background:var(--decide-bg); border-color:var(--decide-edge); }
  .node.decide .who-does { color:var(--warn); }

  /* ---------- Bento (หน้าแรก) ---------- */
  .bento { display:grid; grid-template-columns:repeat(12, minmax(0, 1fr)); grid-auto-rows:minmax(92px, auto); gap:14px; margin:12px 0 18px; }
  .tile { position:relative; border-radius:var(--radius); padding:16px 18px; background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); overflow:hidden; min-width:0; animation:rise .3s ease both; }
  .tile::after { content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit; background:linear-gradient(135deg, rgba(255,255,255,.35), transparent 38%); opacity:.6; }
  .tile > * { position:relative; z-index:1; }
  .tile h3 { margin:0 0 6px; font-size:15px; font-weight:700; color:var(--muted); letter-spacing:.01em; }
  .tile .big { font-size:34px; font-weight:700; line-height:1.15; letter-spacing:-.01em; }
  .tile .sub { font-size:13.5px; color:var(--muted); }
  .t-hero { grid-column:span 6; grid-row:span 2; }
  .t-hero .big { font-size:30px; }
  .t-hero { display:flex; flex-direction:column; }
  .t-hero .actions { justify-content:flex-start; margin-top:auto; padding-top:16px; flex-wrap:wrap; }
  .t-3 { grid-column:span 3; } .t-4 { grid-column:span 4; } .t-6 { grid-column:span 6; } .t-8 { grid-column:span 8; } .t-12 { grid-column:span 12; }
  .tile.link { cursor:pointer; transition:transform .15s ease, box-shadow .2s ease; } .tile.link:hover { transform:translateY(-3px); box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 14px 34px rgba(40,60,110,.2); }
  .tile.warnt { border-color:var(--decide-edge); }
  .tile .list { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .tile .list .row { display:flex; justify-content:space-between; gap:10px; font-size:14.5px; padding:5px 10px; border-radius:10px; background:var(--chip); }
  .tile .list .row.clickable { cursor:pointer; } .tile .list .row.clickable:hover { background:var(--hover); }
  .skel { background:linear-gradient(90deg, var(--mute-bg), rgba(255,255,255,.35), var(--mute-bg)); background-size:200% 100%; animation:shimmer 1.2s linear infinite; border-radius:8px; height:1em; display:inline-block; width:60%; }
  @keyframes shimmer { to { background-position:-200% 0; } }

  /* ---------- Bento แบบ Finance Bento (โทนสว่าง): การ์ดไล่สี เลขใหญ่บาง ขีดไล่ระดับ ขอบสว่างด้านใน ---------- */
  .tile { color:var(--ink); }
  .tile .rim { position:absolute; inset:0; border-radius:inherit; box-shadow:inset 0 1px 0 rgba(255,255,255,.85), inset 0 0 0 1px rgba(255,255,255,.5); pointer-events:none; z-index:2; }
  .g-blue { background:linear-gradient(180deg,#dfe6ff 0%,#b3c3ff 42%,#9fb1ff 100%); }
  .g-lime { background:linear-gradient(180deg,#f7ffd0 0%,#e4f98a 45%,#d3ee5c 100%); }
  .g-pink { background:linear-gradient(180deg,#ffe3ef 0%,#ffbad9 45%,#ff9fc8 100%); }
  .g-copper { background:linear-gradient(180deg,#ffe9d8 0%,#ffcba5 45%,#f5b287 100%); }
  .g-green { background:linear-gradient(180deg,#e0f7ec 0%,#b4e8d0 45%,#8fd9b8 100%); }
  .g-silver { background:linear-gradient(180deg,#f6f7fb 0%,#e1e4ee 55%,#d3d7e4 100%); }
  .tile.g-blue, .tile.g-lime, .tile.g-pink, .tile.g-copper, .tile.g-green, .tile.g-silver { border-color:rgba(255,255,255,.7); }
  .tile .cap { font-size:12.5px; font-weight:600; letter-spacing:.04em; color:rgba(27,31,42,.62); }
  .tile .big { font-weight:200; font-size:56px; letter-spacing:-.04em; line-height:1; }
  .tile .big.thin { font-size:40px; }
  .tile .sub { color:rgba(27,31,42,.66); }
  .tile .chip { display:inline-flex; align-items:center; height:22px; padding:0 10px; border-radius:11px; background:rgba(27,31,42,.88); color:#fff; font:600 11.5px 'Geist Mono',monospace; }
  .tile .btn { background:rgba(255,255,255,.55); }
  .tile .list .row { background:rgba(255,255,255,.6); }
  #tList .list { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px, 1fr)); gap:8px; }
  .t-hero .big { line-height:1.3; margin-bottom:6px; }
  .t-hero { color:var(--ink); border-color:rgba(255,255,255,.7); }
  .t-hero h3, .t-hero .sub { color:rgba(27,31,42,.68); }
  .t-hero .big { font-weight:300; font-size:36px; }
  .t-hero .btn { background:rgba(255,255,255,.6); border-color:rgba(255,255,255,.9); color:var(--ink); }
  .t-hero .btn:hover { background:#fff; }
  .t-hero .rtag { background:rgba(255,255,255,.8); }
  .ticks { display:flex; align-items:flex-end; gap:3px; height:22px; margin-top:14px; }
  .ticks i { flex:1; min-width:2px; height:55%; border-radius:2px; background:rgba(27,31,42,.2); }
  .ticks i:nth-child(6n+1) { height:100%; }
  .ticks i.on { background:var(--ink); }
  .gauge { display:block; margin:6px auto 0; }
  .gauge-num { text-align:center; margin-top:-62px; }
  .gauge-num .big { font-size:52px; }
  .seg { display:inline-flex; padding:3px; gap:2px; border-radius:14px; background:rgba(255,255,255,.55); border:1px solid rgba(255,255,255,.8); }
  .seg button { border:0; height:28px; min-width:44px; padding:0 12px; border-radius:11px; background:transparent; color:var(--muted); font-weight:600; font-size:13px; cursor:pointer; transition:background .25s,color .25s; }
  .seg button[aria-pressed="true"] { background:var(--ink); color:#fff; }
  .inbox { display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; margin:2px 0 4px; }
  .inbox .note { margin-right:4px; }

  /* ---------- ผังภาพรวม ---------- */
  .chart { display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:14px; align-items:start; }
  .lane { background:var(--lane); border:1px solid var(--lane-edge); border-radius:var(--radius); padding:12px 12px 16px; }
  .lane > h3 { margin:0 0 10px; text-align:center; font-size:17px; font-weight:700; }
  .lane ol { list-style:none; margin:0; padding:0; }
  .lane li { position:relative; padding-bottom:22px; }
  .lane li:last-child { padding-bottom:0; }
  .lane li:not(:last-child)::after { content:''; position:absolute; left:50%; bottom:3px; height:14px; border-left:1.5px solid var(--node-edge); opacity:.7; }
  .lane li:not(:last-child)::before { content:''; position:absolute; left:calc(50% - 4px); bottom:0; border:4.5px solid transparent; border-top:6px solid var(--node-edge); border-bottom:0; opacity:.7; }
  .lane li.hand { padding-bottom:40px; }
  .lane li.hand .hlabel { position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:1; font-size:12.5px; padding:0 10px; }
  .lane li.hand::after { height:30px; }
  .chart .node.later { border-style:dashed; border-color:var(--rule); background:transparent; box-shadow:none; }
  .chart .node.later::before { background:var(--rule); }
  .chart .node.sys.later { background:var(--sys-bg); opacity:.75; }
  .chart .node.later .t { color:var(--muted); font-weight:600; }
  .chart .node.later .who-does { color:var(--muted); }
  .chart .node.mine { box-shadow:0 0 0 2px var(--bar), 0 6px 18px rgba(40,60,110,.2); }
  .stepno { position:absolute; right:8px; top:6px; font-size:12.5px; color:var(--muted); }
  .uses { display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
  .uses button, .uses span { font-size:13px; border:1px solid var(--glass-line); background:var(--chip); border-radius:999px; padding:0 9px; line-height:1.7; }
  .uses button { cursor:pointer; } .uses button:hover { border-color:var(--focus); }
  .uses b { font-weight:700; margin-left:4px; }
  .uses .alert { border-color:var(--decide-edge); background:var(--decide-bg); color:var(--warn); }
  .node.live-link { cursor:pointer; transition:transform .15s; } .node.live-link:hover { transform:translateY(-2px); } .node.live-link:hover .t { text-decoration:underline; text-underline-offset:3px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 22px; margin-top:20px; padding-top:12px; border-top:1px solid var(--rule-soft); font-size:13.5px; color:var(--muted); }
  .legend span { display:inline-flex; gap:7px; align-items:center; }
  .sw { width:24px; height:14px; border-radius:5px; border:1.5px solid var(--node-edge); display:inline-block; background:var(--glass-strong); }
  .sw.sys { background:var(--sys-bg); border-color:var(--sys-edge); } .sw.later { border-style:dashed; border-color:var(--rule); }
  .sw.mine { box-shadow:0 0 0 2px var(--focus); }
  .mine-list { margin:0 0 24px; }

  /* ---------- ตาราง (การ์ดกระจก อ่านง่าย หัวตารางติดบน) ---------- */
  .register { overflow:auto; max-height:calc(100vh - 230px); border:1px solid var(--glass-edge); border-radius:var(--radius); background:var(--glass-strong); box-shadow:var(--shadow); }
  table { border-collapse:separate; border-spacing:0; width:100%; font-size:15px; }
  th, td { padding:7px 12px; border-bottom:1px solid var(--rule-soft); white-space:nowrap; vertical-align:top; }
  thead th { position:sticky; top:0; z-index:2; background:var(--glass-strong); font-weight:600; font-size:14px; text-align:center; vertical-align:middle; line-height:1.35; border-bottom:1px solid var(--rule); }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:var(--hover); }
  td.num { text-align:right; }
  td.wrap { white-space:normal; min-width:200px; }
  tbody tr.clickable { cursor:pointer; }
  tr.mine td:first-child { box-shadow:inset 5px 0 0 var(--r-plan); padding-left:16px; }
  td.empty { padding:30px; text-align:center; color:var(--muted); white-space:normal; }
  .chip { display:inline-block; font-size:13.5px; padding:0 8px; border-radius:8px; background:var(--chip); border:1px solid var(--rule-soft); margin:0 4px 2px 0; }
  .chip.me { background:rgba(123,63,209,.14); border-color:rgba(123,63,209,.4); color:var(--r-plan); font-weight:600; }
  code { font-size:13.5px; background:var(--chip); padding:1px 6px; border-radius:6px; }
  .more { display:flex; justify-content:center; padding:10px; }

  /* ---------- กล่องโต้ตอบ ---------- */
  dialog { border:0; padding:0; overflow:visible; background:transparent; width:min(620px, calc(100vw - 24px)); color:var(--ink); }
  dialog[open] { animation:pop .2s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop { from { opacity:0; transform:scale(.96) translateY(8px); } to { opacity:1; transform:none; } }
  dialog::backdrop { background:rgba(20,28,50,.38); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); }
  dialog .node { padding:18px 22px 16px 28px; max-height:calc(100vh - 40px); overflow:auto; border-radius:var(--radius); background:var(--glass-strong); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); box-shadow:0 24px 70px rgba(20,30,60,.35), 0 1px 0 rgba(255,255,255,.8) inset; }
  dialog .node::before { top:18px; bottom:18px; left:10px; }
  dialog h2 { margin:0 0 14px; font-size:21px; }
  .field { margin-bottom:12px; }
  .field > label { display:block; font-size:14.5px; font-weight:600; margin-bottom:3px; }
  .field .hint { font-size:13.5px; color:var(--muted); }
  .field input[type=text], .field input[type=password], .field select, .field textarea { width:100%; padding:8px 12px; border:1px solid var(--rule); border-radius:12px; background:var(--solid); transition:box-shadow .15s, border-color .15s; }
  .field input:focus, .field select:focus, .field textarea:focus { outline:none; box-shadow:0 0 0 3px rgba(36,89,214,.28); border-color:var(--focus); }
  .field .err { color:var(--bad); font-size:14px; }
  .field.bad input, .field.bad select, .field.bad textarea { border-color:var(--bad); }
  .req { color:var(--bad); }
  .checks { display:flex; flex-wrap:wrap; gap:4px 14px; }
  .checks label { display:inline-flex; gap:6px; align-items:center; }
  .suffix { display:flex; } .suffix input { border-radius:12px 0 0 12px !important; } .suffix span { border:1px solid var(--rule); border-left:0; border-radius:0 12px 12px 0; padding:8px 12px; background:var(--chip); color:var(--muted); white-space:nowrap; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }

  /* ---------- หน้าเข้าสู่ระบบ ---------- */
  .login { min-height:100vh; display:grid; grid-template-columns:minmax(0, 1.25fr) minmax(320px, 460px); gap:20px; padding:20px; }
  .login .art { background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); border-radius:28px; padding:40px 36px; display:flex; flex-direction:column; justify-content:center; gap:22px; }
  .login .art h1 { font-size:34px; line-height:1.25; margin:0; letter-spacing:-.01em; max-width:20ch; }
  .login .art p { margin:0; color:var(--muted); max-width:52ch; }
  .login .art .chart { gap:10px; }
  .login .art .lane { padding:10px 8px 12px; }
  .login .art .node { padding:5px 8px 6px 16px; } .login .art .node .t { font-size:14px; } .login .art .node .d, .login .art .stepno, .login .art .uses { display:none; }
  .login .art .lane li { padding-bottom:16px; } .login .art .lane li.hand { padding-bottom:16px; } .login .art .lane li.hand .hlabel { display:none; } .login .art .lane li.hand::after { height:9px; }
  .login .art .lane li:not(:last-child)::after { height:9px; }
  .login .formside { display:flex; align-items:center; }
  .login form { width:100%; background:var(--glass-strong); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); border-radius:28px; padding:30px 28px; }
  .login h2 { font-size:24px; margin:0 0 4px; }
  .login .foot { margin-top:18px; font-size:13.5px; color:var(--muted); }

  /* ---------- มุมมองพิมพ์ (กระดาษขาวเสมอ) ---------- */
  #printArea { display:none; }
  body.printing #printArea { display:block; position:fixed; inset:0; background:#fff; color:#000; z-index:200; overflow:auto; padding:16px; }
  .printbar { position:sticky; top:0; background:#fff; border-bottom:1px solid #ccc; padding:8px 0; margin-bottom:12px; display:flex; gap:10px; align-items:center; z-index:1; }
  @media print { body, body::before { background:#fff !important; } body.printing #appView, body.printing #loginView, body.printing dialog, body.printing #toasts { display:none !important; } body.printing #printArea { position:static; padding:0; overflow:visible; } .printbar { display:none !important; } }
  @media (max-width: 1100px) { .t-hero { grid-column:span 12; grid-row:auto; } .t-3 { grid-column:span 6; } .t-4 { grid-column:span 6; } .t-8 { grid-column:span 12; } .t-6 { grid-column:span 12; } }
  @media (max-width: 980px) { .chart { grid-template-columns:1fr; } .login { grid-template-columns:1fr; } .login .art { display:none; } }
  @media (max-width: 860px) {
    .tool kbd { display:none; }
    .search { width:100%; }
    .page-title { font-size:24px; }
    .bento { gap:10px; } .t-3, .t-4 { grid-column:span 12; }
    .register { max-height:none; }
  }

  /* =====================================================================
     สไตล์ของฉัน (STYLE_GUIDE): Liquid Glass แบบแบน · ธีมสว่าง · แถบเมนูบนสุด · สีประจำหน้า · สวิตช์โหมดสีส้ม
     ===================================================================== */
  :root {
    --ink:#141b2d; --muted:#3f4859; --faint:#646d7e; --bg:#f5f6fa; --line:rgba(20,27,45,.09);
    --rule:rgba(20,27,45,.2); --rule-soft:rgba(20,27,45,.09); --glass-line:rgba(20,27,45,.12);
    --ok:#0f9466; --warn:#c26a00; --bad:#d01c3f; --switch:#d9560a; --switch-dark:#a84106;
    --page:#1262f0; --page-light:#3b9bff; --page-dark:#0a3cb0; --focus:#1262f0;
    --radius:22px; --radius-sm:14px;
    --shadow:0 1px 0 rgba(255,255,255,.85) inset, 0 2px 12px rgba(20,27,45,.06);
    --blur:blur(14px) saturate(1.4);
    --bg1:#f5f6fa; --bg2:#e8f0ff; --bg3:#e3f8ee; --bg4:#fff1e4;
    --f-sm:12.5px; --f-md:13.5px; --f-base:15px; --f-lg:16px;
  }
  body[data-page="green"] { --page:#079a55; --page-light:#2edc86; --page-dark:#04703c; --focus:#079a55; --bg2:#e3f8ee; }
  body[data-page="orange"] { --page:#f26a00; --page-light:#ffa63d; --page-dark:#b04800; --focus:#c25400; --bg2:#fff1e4; }
  body[data-page="pink"] { --page:#d81b72; --page-light:#ff5aa5; --page-dark:#9a0f50; --focus:#d81b72; --bg2:#ffe9f3; }
  body[data-page="purple"] { --page:#7a4dff; --page-light:#5aa2ff; --page-dark:#4a22c4; --focus:#7a4dff; --bg2:#efe9ff; }
  body { transition:background-color .4s ease; }
  body::before { transition:opacity .4s; }
  .btn, .tool, .grp-head, .side .item, .uses button, button.handoff, .seg button { min-height:40px; }
  .btn.small { min-height:40px; padding:4px 14px; }
  .field input[type=text], .field input[type=password], .field select, .search, #l_pw { min-height:40px; }
  input[type=checkbox], input[type=radio] { width:22px; height:22px; accent-color:var(--page); }
  @media (pointer:coarse) { .btn, .btn.small, .tool, .grp-head, .side .item, .uses button, button.handoff, .field input[type=text], .field input[type=password], .field select, .search { min-height:44px; } }
  .btn.primary { background:var(--page); border-color:var(--page-dark); text-shadow:none; }
  .btn.primary:hover { background:var(--page-dark); }
  .page-title { font-size:26px; }
  .page-title::after { content:''; display:block; width:44px; height:4px; border-radius:4px; margin-top:6px; background:linear-gradient(90deg, var(--page), var(--page-light)); }

  /* ---- แถบบนสุด: เกาะกระจกใส ติดบนเมื่อเลื่อน (ข้อความอยู่ที่เดิม) ---- */
  .topbar { position:sticky; top:8px; z-index:30; display:flex; gap:10px; align-items:flex-start; padding:0; margin:8px 12px 0; background:none; border:0; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; border-radius:0; flex-wrap:nowrap; }
  .island { background:var(--glass); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:var(--shadow); border-radius:var(--radius); }
  .navisle { flex:1; min-width:0; display:flex; flex-direction:column; padding:8px 10px 6px; }
  .navisle .brand { display:none; }
  .navisle > .side, .navrow, .subrow { min-width:0; width:100%; max-width:100%; }
  .navisle { overflow:hidden; }
  .navisle:has(.grp-items:not(.hidden)) { overflow:hidden; }
  .modeisle { display:flex; padding:5px; gap:3px; align-self:flex-start; border-radius:999px; }
  .modeisle.hidden { display:none; }
  .modeisle button { border:0; min-height:44px; padding:0 18px; border-radius:999px; background:transparent; color:var(--switch-dark); font-weight:600; cursor:pointer; transition:background .3s, color .3s; }
  .modeisle button[aria-pressed="true"] { background:var(--switch); color:#fff; }
  .toolisle { display:flex; align-items:center; gap:8px; padding:6px 8px; align-self:flex-start; border-radius:999px; }
  .who { position:relative; }
  .whochip { display:flex; align-items:center; gap:8px; min-height:40px; padding:0 14px; border:1px solid var(--glass-line); background:var(--glass-strong); border-radius:999px; cursor:pointer; }
  .whochip .name { font-weight:600; max-width:160px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .whochip #whoRoles { display:none; }
  .whomenu { position:absolute; right:0; top:calc(100% + 8px); min-width:230px; z-index:40; padding:12px; border-radius:var(--radius-sm); background:var(--glass-strong); -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); border:1px solid var(--glass-edge); box-shadow:0 12px 32px rgba(20,27,45,.16); display:flex; flex-direction:column; gap:8px; }
  .whomenu.hidden { display:none; }
  .whomenu #whoRolesMenu { display:flex; flex-wrap:wrap; gap:4px; }
  .shell { display:block; padding:8px 12px 0; }
  main { padding:8px 8px 64px; max-width:1320px; margin:0 auto; animation:none; }
  main.rise { animation:rise .35s cubic-bezier(.32,.72,0,1) both; }

  /* ---- เมนู: แท็บบน + แถวรายการย่อย + เม็ดยาเลื่อนตามแท็บ ---- */
  .side { position:static; display:block; max-height:none; overflow:visible; background:none; border:0; box-shadow:none; -webkit-backdrop-filter:none; backdrop-filter:none; padding:0; border-radius:0; }
  .navrow { position:relative; display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; padding:0 0 2px; align-items:center; }
  .navrow::-webkit-scrollbar { display:none; }
  .navpill { position:absolute; left:0; top:0; bottom:2px; border-radius:999px; background:var(--page); width:0; transition:transform .38s cubic-bezier(.32,.72,0,1), width .38s cubic-bezier(.32,.72,0,1), background-color .3s, opacity .2s; pointer-events:none; z-index:0; }
  .navrow > .item, .navrow > .grp-head { position:relative; z-index:1; flex:none; width:auto; white-space:nowrap; border-radius:999px; padding:0 14px; gap:8px; transition:color .25s; }
  .navrow > .item { display:flex; align-items:center; border:0; background:none; cursor:pointer; margin:0; }
  .grp-head { font-size:var(--f-base); font-weight:600; color:var(--muted); }
  .grp-head i { width:9px; height:9px; }
  .grp-head .chev { display:none; }
  .navrow > .item[aria-current="true"], .navrow > .grp-head.on { color:#fff; background:none; box-shadow:none; }
  .navrow > .item[aria-current="true"] .ico, .navrow > .grp-head.on .ico { color:#fff; }
  .navrow > .grp-head.on i { background:#fff !important; }
  .side .item:hover, .grp-head:hover { background:var(--hover); }
  .navrow > .item[aria-current="true"]:hover, .navrow > .grp-head.on:hover { background:none; }
  .subrow { display:block; }
  .subrow .grp-items { display:flex; gap:4px; overflow-x:auto; scrollbar-width:none; padding:6px 0 4px; border-top:1px solid var(--line); margin-top:6px; animation:rise .3s ease both; }
  .subrow .grp-items.hidden { display:none; }
  .subrow .grp-items::-webkit-scrollbar { display:none; }
  .subrow .item { flex:none; width:auto; white-space:nowrap; border-radius:999px; padding:0 12px; font-size:var(--f-md); color:var(--muted); }
  .subrow .item[aria-current="true"] { background:color-mix(in srgb, var(--page) 14%, white); color:var(--page-dark); box-shadow:inset 0 0 0 1.5px var(--page); font-weight:600; }
  .subrow .item[aria-current="true"] .ico { color:var(--page-dark); }
  .side .count { font-size:var(--f-sm); }

  /* ---- การ์ดแบน: ไล่โทนอ่อนจากสีประจำหน้า ---- */
  .tile { border-radius:22px; box-shadow:var(--shadow); }
  .tile::after { display:none; }
  .tile.link:hover { box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 8px 22px rgba(20,27,45,.1); }
  .g-blue { background:linear-gradient(160deg, rgba(59,155,255,.26), rgba(18,98,240,.12) 70%), var(--glass-strong); }
  .g-lime { background:linear-gradient(160deg, rgba(46,220,134,.26), rgba(7,154,85,.10) 70%), var(--glass-strong); }
  .g-pink { background:linear-gradient(160deg, rgba(255,90,165,.22), rgba(216,27,114,.09) 70%), var(--glass-strong); }
  .g-copper { background:linear-gradient(160deg, rgba(255,166,61,.28), rgba(242,106,0,.10) 70%), var(--glass-strong); }
  .g-green { background:linear-gradient(160deg, rgba(46,220,134,.26), rgba(7,154,85,.10) 70%), var(--glass-strong); }
  .g-silver { background:var(--glass-strong); }
  .tile .cap { color:var(--muted); font-size:var(--f-sm); }
  .tile .sub, .t-hero h3, .t-hero .sub { color:var(--muted); font-size:var(--f-md); }
  .tile .big { font-weight:300; }
  .ticks i.on { background:var(--page); }
  .t-hero .big { font-weight:300; }
  .tile .chip { font-size:var(--f-sm); }
  .register { border-radius:22px; box-shadow:var(--shadow); }
  td.num, .tile .num { text-align:right; font-variant-numeric:tabular-nums; }
  dialog .node { border-radius:24px; }
  .node { border-radius:16px; }
  .legend, .legend span { font-size:var(--f-md); }

  @media (max-width: 860px) {
    .topbar { flex-wrap:wrap; margin:6px 8px 0; top:4px; }
    .navisle { flex:1 1 100%; order:3; }
    .modeisle, .toolisle { order:1; }
    .toolisle { margin-left:auto; }
    .modeisle button { padding:0 14px; }
    .tool .tl { display:none; }
    .whochip .name { max-width:90px; }
    main { padding:12px 4px 56px; }
    .shell { padding:6px 8px 0; }
  }

  /* =====================================================================
     พื้นหลัง WebGL (Mesh drift) · ไล่สี 3 สีประจำแต่ละแถบ · หน้าต้อนรับ · หน้าเข้าสู่ระบบ
     ===================================================================== */
  :root, body[data-page="blue"] { --g1:#0a4fd8; --g2:#1f86ff; --g3:#16b5d8; }
  body[data-page="green"] { --g1:#067a45; --g2:#12b26b; --g3:#7bc62f; }
  body[data-page="orange"] { --g1:#d85a00; --g2:#f58a14; --g3:#f2b01e; }
  body[data-page="pink"] { --g1:#c2185b; --g2:#e8458f; --g3:#ff7a8a; }
  body[data-page="purple"] { --g1:#5b34d6; --g2:#7a4dff; --g3:#4f8bff; }
  #bgGL { position:fixed; inset:0; width:100%; height:100%; z-index:-2; display:block; pointer-events:none; }
  html.gl body { background:transparent; }
  html.gl body::before { background:
    radial-gradient(55vmax 45vmax at 4% 0%, color-mix(in srgb, var(--g1) 16%, transparent), transparent 62%),
    radial-gradient(50vmax 45vmax at 100% 6%, color-mix(in srgb, var(--g2) 14%, transparent), transparent 62%),
    radial-gradient(55vmax 50vmax at 78% 100%, color-mix(in srgb, var(--g3) 16%, transparent), transparent 62%); }
  .btn.primary { background:linear-gradient(135deg, var(--g1), var(--g2) 55%, var(--g3)); border-color:transparent; box-shadow:0 6px 18px -6px color-mix(in srgb, var(--g2) 70%, transparent), 0 1px 0 rgba(255,255,255,.3) inset; }
  .btn.primary:hover { background:linear-gradient(135deg, var(--g1), var(--g2) 55%, var(--g3)); filter:brightness(1.08) saturate(1.05); }
  .btn.primary:disabled { filter:grayscale(.4) opacity(.7); cursor:wait; }
  .page-title::after { width:60px; background:linear-gradient(90deg, var(--g1), var(--g2), var(--g3)); }
  .navpill { background:linear-gradient(120deg, var(--g1), var(--g2) 60%, var(--g3)); box-shadow:0 6px 16px -6px color-mix(in srgb, var(--g2) 75%, transparent); }
  body[data-page="teal"] { --page:#0b7f8f; --page-light:#22b8c4; --page-dark:#075a66; --focus:#0b7f8f; --bg2:#e0f6f7; --g1:#075f73; --g2:#0f93a8; --g3:#2fbfc4; }
  body[data-page="indigo"] { --page:#1a3fae; --page-light:#4f7cff; --page-dark:#0b2a6b; --focus:#1a3fae; --bg2:#e8eeff; --g1:#0b2a6b; --g2:#1556d6; --g3:#f26a00; }
  body[data-page="orange"] { --g1:#c94f00; --g2:#f26a00; --g3:#ffa63d; }
  /* ม่านขาวบาง ๆ ทับพื้นหลังเคลื่อนไหว ให้ตัวหนังสือเด่นกว่าพื้น */
  html.gl body::before { background:
    radial-gradient(55vmax 45vmax at 4% 0%, color-mix(in srgb, var(--g1) 14%, transparent), transparent 62%),
    radial-gradient(50vmax 45vmax at 100% 6%, color-mix(in srgb, var(--g2) 12%, transparent), transparent 62%),

07,.08), 0 6px 16px -8px rgba(11,42,107,.5); }
  .logoisle { display:grid; place-items:center; width:52px; height:52px; flex:none; padding:0; border-radius:18px; }
  .logoisle .logo { width:40px; height:40px; }
  @media (max-width: 700px) { .logoisle { display:none; } }
  .zdot { width:9px; height:9px; border-radius:50%; display:inline-block; flex:none; }
  .z-orange { background:linear-gradient(135deg,#c94f00,#ffa63d); } .z-teal { background:linear-gradient(135deg,#075f73,#2fbfc4); } .z-indigo { background:linear-gradient(135deg,#0b2a6b,#1556d6 60%,#f26a00); } .z-blue { background:linear-gradient(135deg,#0a4fd8,#16b5d8); }
  .navrow > .grp-head.on .zdot { background:#fff; }
  .pno { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:8px; font-size:12.5px; font-weight:700; background:rgba(20,27,45,.07); color:var(--muted); flex:none; }
  .subrow .item[aria-current="true"] .pno { background:var(--page); color:#fff; }
  /* แท็บภายในหน้า (หน้าหนึ่งรวมหลายทะเบียนที่ทำงานต่อกัน) */
  .pagetabs { display:flex; align-items:center; gap:10px 14px; flex-wrap:wrap; margin:12px 10px 0 20px; animation:rise .25s ease both; }
  .pagetabs.hidden { display:none; }
  .pt-name { display:inline-flex; align-items:center; gap:8px; font-weight:700; color:var(--ink); }
  .pt-name b { display:inline-grid; place-items:center; width:26px; height:26px; border-radius:9px; color:#fff; font-size:13px; background:linear-gradient(135deg, var(--g1), var(--g2) 60%, var(--g3)); }
  .pt-tabs { display:flex; gap:4px; padding:4px; border-radius:16px; background:rgba(255,255,255,.62); border:1px solid rgba(255,255,255,.9); box-shadow:var(--shadow); overflow-x:auto; scrollbar-width:none; max-width:100%; -webkit-backdrop-filter:var(--blur); backdrop-filter:var(--blur); }
  .pt-tabs::-webkit-scrollbar { display:none; }
  .pt-tabs button { flex:none; display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border:0; border-radius:12px; background:none; color:var(--muted); font-weight:600; font-size:var(--f-md); cursor:pointer; transition:background .2s, color .2s; white-space:nowrap; }
  .pt-tabs button:hover { background:rgba(20,27,45,.05); color:var(--ink); }
  .pt-tabs button[aria-selected="true"] { background:#fff; color:var(--page-dark); box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 2px 8px -2px rgba(20,27,45,.16), inset 0 0 0 1.5px color-mix(in srgb, var(--page) 55%, transparent); }
  .pt-tabs .count:empty { display:none; }
  /* ถาดงานในหน้าแรก */
  .tray-row { display:grid; grid-template-columns:auto minmax(0,1fr) auto auto; gap:10px; align-items:center; }
  .tray-row .doc { font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tray-row .doc small { font-weight:400; color:var(--muted); margin-left:6px; }
  .tray-row .age { font-variant-numeric:tabular-nums; color:var(--muted); font-size:var(--f-md); }

  /* ================= หน้าเข้าสู่ระบบ: การ์ดเดียวกลางจอ ตราโรงเรียนซ้อนขอบบน ================= */
  @keyframes cardin { from { opacity:0; translate:0 22px; } to { opacity:1; translate:0 0; } }
  @keyframes emblem { from { opacity:0; transform:translateY(10px) scale(.92); } to { opacity:1; transform:none; } }
  .login { min-height:100vh; display:grid; place-items:center; grid-template-columns:1fr; padding:72px 16px 32px; }
  .lg-stack { position:relative; width:min(100%,420px); }
  .lg-stack .peek { position:absolute; left:26px; right:26px; top:-16px; height:90px; border-radius:30px; z-index:0; transition:transform .5s cubic-bezier(.22,1,.36,1); }
  .lg-stack .peek.o { background:linear-gradient(120deg,#c94f00,#f26a00 55%,#ffb35c); transform:rotate(-4deg); }
  .lg-stack .peek.b { top:-6px; left:12px; right:40px; background:linear-gradient(120deg,#0b2a6b,#1556d6 55%,#3fa0ff); transform:rotate(3deg); }
  .lg-stack:focus-within .peek.o { transform:rotate(-6deg) translateY(-4px); } .lg-stack:focus-within .peek.b { transform:rotate(5deg) translateY(-2px); }
  .login form { position:relative; z-index:1; width:100%; padding:70px 30px 26px; border-radius:30px; background:rgba(255,255,255,.94); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border:1px solid #fff; box-shadow:0 30px 70px -36px rgba(11,42,107,.6), 0 1px 0 #fff inset; animation:cardin .55s cubic-bezier(.22,1,.36,1) both; text-align:center; }
  .login .emblem { position:absolute; left:50%; top:-56px; width:112px; height:112px; margin-left:-56px; box-shadow:0 0 0 6px rgba(255,255,255,.95), 0 18px 34px -16px rgba(11,42,107,.65); animation:emblem .6s cubic-bezier(.22,1,.36,1) .1s both; }
  .login h2 { margin:0; font-size:22px; color:#0b2a6b; letter-spacing:-.005em; }
  .login .org { margin:4px 0 22px; color:var(--muted); font-size:var(--f-md); line-height:1.5; }
  .login .field { text-align:left; }
  .login .field input:focus { outline:0; border-color:#1556d6; box-shadow:0 0 0 4px rgba(21,86,214,.16); }
  .login #loginBtn { width:100%; margin-top:6px; min-height:50px; border-radius:16px; font-size:16px; background:linear-gradient(135deg,#c94f00,#f26a00 55%,#ff9b3d); box-shadow:0 14px 26px -14px rgba(242,106,0,.95), 0 1px 0 rgba(255,255,255,.35) inset; }
  .login .foot { margin:16px 0 0; font-size:var(--f-sm); color:var(--faint); }
  @media (prefers-reduced-motion: reduce) { .login form, .login .emblem { animation:none !important; } .lg-stack .peek { transition:none; } }

  /* ================= ไทม์ไลน์งาน (workflow blueprint) ================= */
  @keyframes wb-travel { to { stroke-dashoffset:-192; } }

<script type="x-shader/x-fragment" id="glFrag">
// "Mesh drift" blobs shader
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif

uniform vec3 u_colors[8];
uniform vec4 u_scene;      // resolution.xy, time, colour count
uniform vec4 u_shape;      // scale, intensity, paramA, warp
uniform vec4 u_surface;    // detail, contrast, brightness, saturation
uniform vec4 u_finish;     // hue, vignette, blur, grain
uniform vec4 u_transform;  // seed, rotation, drift, OKLab toggle
uniform vec4 u_space;      // offset.xy, pointer.xy
uniform vec4 u_cursor;

#define u_resolution u_scene.xy
#define u_time u_scene.z
#define u_colorCount u_scene.w
#define u_scale u_shape.x
#define u_intensity u_shape.y
#define u_paramA u_shape.z
#define u_warp u_shape.w
#define u_detail u_surface.x
#define u_contrast u_surface.y
#define u_brightness u_surface.z
#define u_saturation u_surface.w
#define u_hue u_finish.x
#define u_vignette u_finish.y
#define u_blur u_finish.z
#define u_grain u_finish.w
#ifdef GL_FRAGMENT_PRECISION_HIGH
#define u_seed u_transform.x
#else
#define u_seed mod(u_transform.x, 31.0)
#endif
#define u_rotate u_transform.y
#define u_drift u_transform.z
#define u_oklab u_transform.w
#define u_offset u_space.xy
#define u_mouse u_space.zw
#define u_cursorPresence u_cursor.x
#define u_cursorEffect u_cursor.y
#define u_cursorStrength u_cursor.z
#define u_cursorRadius u_cursor.w

float hash21(vec2 p) {
#ifndef GL_FRAGMENT_PRECISION_HIGH
  p = mod(p, 31.0);
#endif
  p = fract(p * vec2(234.34, 435.345));
  p += dot(p, p + 34.23);
  return fract(p.x * p.y);
}

float grainHash(vec2 p) {
  vec3 p3 = fract(vec3(p.xyx) * 0.1031);
  p3 += dot(p3, p3.yzx + 33.33);
  return fract((p3.x + p3.y) * p3.z);
}

vec2 hash22(vec2 p) {
#ifndef GL_FRAGMENT_PRECISION_HIGH
  p = mod(p, 31.0);
#endif
  float n = sin(dot(p, vec2(41.0, 289.0)));
  return fract(vec2(15731.743, 7892.321) * n);
}

float noise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(
    mix(hash21(i), hash21(i + vec2(1.0, 0.0)), u.x),
    mix(hash21(i + vec2(0.0, 1.0)), hash21(i + vec2(1.0, 1.0)), u.x),
    u.y);
}

float fbm(vec2 p) {
  float v = 0.0;
  float a = 0.5;
  for (int i = 0; i < 5; i++) {
    v += a * noise(p);
    p = p * 2.03 + vec2(17.0, 9.2);
    a *= 0.5;
  }
  return v;
}

vec3 srgbToLinear(vec3 c) {
  return mix(c / 12.92, pow((c + 0.055) / 1.055, vec3(2.4)),
    step(0.04045, c));
}
vec3 linearToSrgb(vec3 c) {
  return mix(c * 12.92, 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055,
    step(0.0031308, c));
}
vec3 linToOklab(vec3 c) {
  float l = 0.4122214708 * c.r + 0.5363325363 * c.g + 0.0514459929 * c.b;
  float m = 0.2119034982 * c.r + 0.6806995451 * c.g + 0.1073969566 * c.b;
  float s = 0.0883024619 * c.r + 0.2817188376 * c.g + 0.6299787005 * c.b;
  l = pow(max(l, 0.0), 1.0 / 3.0);
  m = pow(max(m, 0.0), 1.0 / 3.0);
  s = pow(max(s, 0.0), 1.0 / 3.0);
  return vec3(
    0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s);
}
vec3 oklabToLin(vec3 c) {
  float l = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
  float m = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
  float s = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
  l = l * l * l; m = m * m * m; s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s);
}
vec3 mixColour(vec3 a, vec3 b, float t) {
  if (u_oklab > 0.5) {
    vec3 la = linToOklab(srgbToLinear(a));
    vec3 lb = linToOklab(srgbToLinear(b));
    return clamp(linearToSrgb(oklabToLin(mix(la, lb, t))), 0.0, 1.0);
  }
  return mix(a, b, t);
}

vec3 palette(float x) {
  float n = max(u_colorCount - 1.0, 1.0);
  float f = clamp(x, 0.0, 1.0) * n;
  vec3 col = u_colors[0];
  for (int i = 0; i < 7; i++) {
    if (float(i) < n)
      col = mixColour(col, u_colors[i + 1],
        smoothstep(0.0, 1.0, clamp(f - float(i), 0.0, 1.0)));
  }
  return col;
}

vec3 hueRotate(vec3 col, float a) {
  const mat3 toYIQ = mat3(0.299, 0.596, 0.211,
                          0.587, -0.274, -0.523,
                          0.114, -0.322, 0.312);
  const mat3 toRGB = mat3(1.0, 1.0, 1.0,
                          0.956, -0.272, -1.106,
                          0.621, -0.647, 1.703);
  vec3 yiq = toYIQ * col;
  float ca = cos(a), sa = sin(a);
  yiq = vec3(yiq.x, yiq.y * ca - yiq.z * sa, yiq.y * sa + yiq.z * ca);
  return toRGB * yiq;
}

vec3 shade(vec2 uv, vec2 p, float t) {
  vec3 acc = u_colors[0] * 0.15;
  float total = 0.15;
  for (int i = 0; i < 8; i++) {
    if (float(i) >= u_colorCount) break;
    float fi = float(i);
    vec2 c = vec2(
      sin(t * (0.21 + fi * 0.071) + fi * 2.4 + u_seed),
      cos(t * (0.17 + fi * 0.093) + fi * 1.7)) * (0.45 + u_intensity * 0.35);
    float w = exp(-dot(p - c, p - c) * 6.0);
    acc += u_colors[i] * w;
    total += w;
  }
  return acc / total;
}

void main() {
  vec2 uv = gl_FragCoord.xy / u_resolution.xy;
  vec2 screenUv = uv;
  vec2 p = (gl_FragCoord.xy - 0.5 * u_resolution.xy)
    / min(u_resolution.x, u_resolution.y);
  float cursorMask = 0.0;

  if (u_cursorPresence > 0.001) {
    vec2 cursor = (0.5 * u_mouse * u_resolution.xy)
      / min(u_resolution.x, u_resolution.y);
    vec2 cursorDelta = p - cursor;
    if (u_cursorEffect < 0.5) {
      p += cursor * u_cursorPresence * u_cursorStrength * 0.55;
    } else {
      float cursorDistance = length(cursorDelta);
      vec2 cursorDirection = cursorDelta / max(cursorDistance, 0.0001);
      cursorMask = u_cursorPresence
        * (1.0 - smoothstep(0.0, u_cursorRadius, cursorDistance));
      if (u_cursorEffect < 1.5) {
        p -= cursorDirection * cursorMask * u_cursorStrength * 0.24;
      } else if (u_cursorEffect < 2.5) {
        float cursorAngle = cursorMask * u_cursorStrength * 2.2;
        float cc = cos(cursorAngle), cs = sin(cursorAngle);
        p = cursor + mat2(cc, -cs, cs, cc) * cursorDelta;
      } else if (u_cursorEffect < 3.5) {
        float ripple = sin(
          cursorDistance / max(u_cursorRadius, 0.001) * 18.0 - u_time * 5.0);
        p -= cursorDirection * ripple * cursorMask * u_cursorStrength * 0.07;
      }
    }
  }

  uv = p * min(u_resolution.x, u_resolution.y) / u_resolution.xy + 0.5;
  p *= u_scale;
  if (abs(u_rotate) > 0.0001) {
    float cr = cos(u_rotate), sr = sin(u_rotate);
    p = mat2(cr, -sr, sr, cr) * p;
  }
  p += u_offset;
  if (u_drift > 0.0001)
    p += u_drift * vec2(sin(u_time * 0.31), cos(u_time * 0.23));
  if (u_warp > 0.0) {
    p += u_warp * (vec2(
      fbm(p * u_detail + u_seed),
      fbm(p * u_detail + vec2(5.2, 1.3))) - 0.5);
  }
  vec3 col;
  if (u_blur > 0.0) {
    float e = u_blur;
    float pe = e * u_scale;
    vec2 uvE = vec2(e) * min(u_resolution.x, u_resolution.y) / u_resolution.xy;
    col  = shade(uv, p, u_time) * 0.36;
    col += shade(uv + vec2(uvE.x, 0.0), p + vec2(pe, 0.0), u_time) * 0.16;
    col += shade(uv - vec2(uvE.x, 0.0), p - vec2(pe, 0.0), u_time) * 0.16;
    col += shade(uv + vec2(0.0, uvE.y), p + vec2(0.0, pe), u_time) * 0.16;
    col += shade(uv - vec2(0.0, uvE.y), p - vec2(0.0, pe), u_time) * 0.16;
  } else {
    col = shade(uv, p, u_time);
  }
  if (abs(u_contrast - 1.0) > 0.0001)
    col = (col - 0.5) * u_contrast + 0.5;
  if (abs(u_saturation - 1.0) > 0.0001) {
    float luma = dot(col, vec3(0.299, 0.587, 0.114));
    col = mix(vec3(luma), col, u_saturation);
  }
  if (abs(u_hue) > 0.0001)
    col = hueRotate(col, u_hue);
  if (abs(u_brightness) > 0.0001)
    col += u_brightness;
  if (u_vignette > 0.0001) {
    float vd = length(screenUv - 0.5) * 1.41421356;
    col *= 1.0 - u_vignette * smoothstep(0.35, 1.0, vd);
  }
  if (u_cursorPresence > 0.001 && u_cursorEffect > 3.5)
    col += (vec3(0.18) + col * 0.12) * cursorMask * u_cursorStrength;
  if (u_grain > 0.0001)
    col += (grainHash(
      gl_FragCoord.xy + vec2(u_seed * 17.0, u_seed * 31.0)) - 0.5) * u_grain;
  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}
</script>

<script>
/* ================= เชื่อมต่อ server ================= */
var TOKEN = null;
try { TOKEN = sessionStorage.getItem('kwc_fin_token'); } catch (e) {}
function saveToken(t) { TOKEN = t; try { t ? sessionStorage.setItem('kwc_fin_token', t) : sessionStorage.removeItem('kwc_fin_token'); } catch (e) {} }
function toast(msg, bad) {
  var box = document.getElementById('toasts'); if (!box) return;
  var el = document.createElement('div'); el.className = 'toast' + (bad ? ' bad' : ''); el.textContent = msg; box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, bad ? 7000 : 3500);
}
// เรียก server: ไม่ throw เสมอ (คืน {ok:false,error}) · หมดเวลา 60 วินาที
function call(action, payload) {
  return new Promise(function (resolve) {
    var done = false, timer = setTimeout(function () { fin({ ok: false, error: 'เซิร์ฟเวอร์ตอบช้าเกินไป ลองใหม่อีกครั้ง (ข้อมูลที่ส่งอาจยังไม่ถูกบันทึก ตรวจรายการก่อนทำซ้ำ)' }); }, 60000);
    function fin(r) { if (done) return; done = true; clearTimeout(timer); resolve(r); }
    try {
      google.script.run.withSuccessHandler(function (r) {
        if (r && r.code === 'AUTH') { saveToken(null); showLogin(r.error); return; }
        fin(r || { ok: false, error: 'ไม่ได้รับคำตอบจากเซิร์ฟเวอร์' });
      }).withFailureHandler(function (e) {
        fin({ ok: false, error: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: ' + ((e && e.message) || e || 'ไม่ทราบสาเหตุ') });
      }).api({ token: TOKEN, action: action, payload: payload || {} });
    } catch (e) { fin({ ok: false, error: 'เรียกเซิร์ฟเวอร์ไม่สำเร็จ: ' + e.message }); }
  });
}
window.addEventListener('error', function (e) { toast('เกิดข้อผิดพลาดในหน้าเว็บ: ' + (e.message || ''), true); });

function money(s) { if (s == null || s === '') return ''; var neg = s < 0, a = Math.abs(s); return (neg ? '-' : '') + Math.floor(a / 100).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + String(a % 100).padStart(2, '0'); }
var TH_M = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

function chartHtml(mini) {
  return CHART.map(function (lane) {
    return '<section class="lane"><h3>' + esc(lane.lane) + '</h3><ol>' + lane.nodes.map(function (n) {
      var later = !n.live;
      var mine = !mini && ME && [n.r].concat(n.also || []).some(function (r) { return r !== 'system' && r !== 'payer' && ME.user.roles.indexOf(r) >= 0; });
      var cls = 'node' + (n.sys ? ' sys' : '') + (later ? ' later' : '') + (mine ? ' mine' : '') + (!mini && n.live && tableMeta(n.live) ? ' live-link' : '');
      var who = n.who || (ME && ME.roles[n.r]) || ({ plan: 'งานแผน', finance: 'การเงิน', requester: 'ครูผู้ขอ', director: 'ผอ.', khj_maker: 'ผู้ทำ ขจ.' }[n.r]) || 'ระบบ';
      if (n.r === 'system') who = 'ระบบ';
      var body = '<div class="' + cls + '" style="--bar:' + roleVar(n.r) + '"' + (!mini && n.live && tableMeta(n.live) ? ' data-go="' + n.live + '" tabindex="0" role="link"' : '') + '>' +
        (later ? '<span class="stepno">ขั้น ' + n.step + '</span>' : '') +
        '<div class="who-does">' + esc(who) + '</div><div class="t">' + esc(n.t) + '</div><div class="d">' + esc(n.d) + '</div>' +
        (mini ? '' : usesHtml(n)) + '</div>';
      return '<li class="' + (n.hand ? 'hand' : '') + '">' + body + (n.hand ? '<span class="handoff hlabel">ส่ง → รับ</span>' : '') + '</li>';
    }).join('') + '</ol></section>';
  }).join('');
}
function usesHtml(n) {
  var list = (n.live ? [n.live] : []).concat(n.uses || []);
  var items = list.filter(function (t) { return ME && tableMeta(t); }).map(function (t) {
    var rows = cache[t] || [];
    var label = SHORT[t] || t, count = rows.length, alert = false;
    if (t === 'payee_account_changes') { count = rows.filter(function (c) { return c.status === 'รออนุมัติ'; }).length; label = 'รออนุมัติเปลี่ยนบัญชี'; alert = count > 0; if (!count) return ''; }
    if (t === 'plan_projects' && n.live) { var mine = rows.filter(function (p) { return p.is_mine; }).length; if (mine) return '<button data-go="plan_projects">โครงการ<b>' + count + '</b></button><button data-go="plan_projects" data-mine="1">ของฉัน<b>' + mine + '</b></button>'; }
    return '<button data-go="' + t + '"' + (alert ? ' class="alert"' : '') + '>' + esc(label) + '<b>' + count + '</b></button>';
  }).join('');
  if (!items) return '';
  return '<div class="uses">' + (n.live ? '' : '<span style="border:0;padding:0;background:none;color:var(--muted)">ข้อมูลที่ใช้</span>') + items + '</div>';
}

$('loginForm').onsubmit = async function (e) {
  e.preventDefault();
  var btn = $('loginBtn'); btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ';
  var r = await call('login', { email: $('l_email').value.trim(), password: $('l_pw').value });
  btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ';
  if (!r.ok) { showErrors($('loginForm'), r); return; }
  saveToken(r.data.token); $('l_pw').value = '';
  boot();
};

  if (!TOKEN) return showLogin('');
  var r = await call('me');
  if (!r || !r.ok) return showLogin(r && r.error);
  ME = r.data;
  $('loginView').classList.add('hidden'); $('appView').classList.remove('hidden');
